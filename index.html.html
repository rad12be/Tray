<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serial Number Tray Finder</title>
<style>
  :root {
    --bg: #0f1720;
    --card: #1a2432;
    --accent: #4fd1c5;
    --accent-dark: #2c7a7b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --cell-bg: #24303f;
    --cell-border: #34455a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100vh;
  }
  .container {
    width: 100%;
    max-width: 460px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  p.sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px 0;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .input-row {
    display: flex;
    gap: 10px;
  }
  input[type="number"] {
    flex: 1;
    background: var(--cell-bg);
    border: 1px solid var(--cell-border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
  }
  input[type="number"]:focus {
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: #05201d;
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #3fb9ad; }

  .results {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 18px;
  }
  .result-box {
    background: var(--cell-bg);
    border: 1px solid var(--cell-border);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
  }
  .result-box .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .result-box .value {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }

  .tray-title {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 12px;
    text-align: center;
  }
  .tray-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
  }
  .cavity {
    aspect-ratio: 1;
    background: var(--cell-bg);
    border: 1px solid var(--cell-border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--muted);
    transition: all 0.15s ease;
  }
  .cavity.active {
    background: var(--accent);
    color: #05201d;
    border-color: var(--accent);
    font-weight: 700;
    transform: scale(1.06);
    box-shadow: 0 0 0 3px rgba(79,209,197,0.25);
  }
  .error {
    color: #f87171;
    font-size: 13px;
    margin-top: 10px;
  }
  .placeholder {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Serial Number Tray Finder</h1>
  <!-- comment this line to maximize screen space -->
  <!-- <p class="sub">Trays hold 12 cavities each (3 columns &times; 4 rows), filled left-to-right, top-to-bottom.</p> -->

  <div class="card">
    <label for="serialInput">Serial Number</label>
    <div class="input-row">
      <input type="number" id="serialInput" min="1" placeholder="e.g. 123" />
      <button id="findBtn">Find</button>
    </div>
    <div class="error" id="errorMsg"></div>

    <div class="results" id="results" style="display:none;">
      <div class="result-box">
        <div class="label">Tray</div>
        <div class="value" id="trayVal">-</div>
      </div>
      <div class="result-box">
        <div class="label">Column</div>
        <div class="value" id="colVal">-</div>
      </div>
      <div class="result-box">
        <div class="label">Row</div>
        <div class="value" id="rowVal">-</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="tray-title" id="trayTitle">Enter a serial number to see its position</div>
    <div class="tray-grid" id="trayGrid"></div>
  </div>
</div>

<script>
  const COLS = 3;
  const ROWS = 4;
  const CAVITIES_PER_TRAY = COLS * ROWS;

  const grid = document.getElementById('trayGrid');
  const trayTitle = document.getElementById('trayTitle');
  const errorMsg = document.getElementById('errorMsg');
  const results = document.getElementById('results');

  function buildEmptyGrid() {
    grid.innerHTML = '';
    for (let i = 0; i < CAVITIES_PER_TRAY; i++) {
      const cell = document.createElement('div');
      cell.className = 'cavity';
      cell.textContent = '';
      grid.appendChild(cell);
    }
  }

  function calculate(serial) {
    const tray = Math.ceil(serial / CAVITIES_PER_TRAY);
    const posInTray = serial - (tray - 1) * CAVITIES_PER_TRAY; // 1..12
    const row = Math.ceil(posInTray / COLS);
    const col = posInTray - (row - 1) * COLS;
    return { tray, row, col, posInTray };
  }

  function render(serial) {
    errorMsg.textContent = '';

    if (!Number.isInteger(serial) || serial < 1) {
      results.style.display = 'none';
      trayTitle.textContent = 'Enter a serial number to see its position';
      buildEmptyGrid();
      errorMsg.textContent = 'Please enter a whole number of 1 or greater.';
      return;
    }

    const { tray, row, col, posInTray } = calculate(serial);

    document.getElementById('trayVal').textContent = tray;
    document.getElementById('colVal').textContent = col;
    document.getElementById('rowVal').textContent = row;
    results.style.display = 'grid';

    const firstItem = (tray - 1) * CAVITIES_PER_TRAY + 1;
    const lastItem = tray * CAVITIES_PER_TRAY;
    trayTitle.textContent = `Tray ${tray} (items ${firstItem}\u2013${lastItem})`;

    buildEmptyGrid();
    const cells = grid.children;
    cells[posInTray - 1].classList.add('active');
    cells[posInTray - 1].textContent = serial;
  }

  document.getElementById('findBtn').addEventListener('click', () => {
    const val = parseInt(document.getElementById('serialInput').value, 10);
    render(val);
  });

  document.getElementById('serialInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const val = parseInt(e.target.value, 10);
      render(val);
    }
  });

  buildEmptyGrid();
</script>
</body>
</html>
